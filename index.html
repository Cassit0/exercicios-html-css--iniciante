<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>listas</title>
</head>
<body>
    <h2>Lista ordenada</h2>
    <ol type="I"> <!-- I, A, 1, a, i -->
        <li>arroz</li>
        <li>feijão</li>
        <li>batata</li>
        <li>galinha</li>
        <li>refrigerante</li>
    </ol>

    <h2>lista não ordenada</h2>
    <ul type="square"><!-- circle, square, disc -->
        <li>arroz</li>
        <li>feijão</li>
        <li>batata</li>
        <li>galinha</li>
        <li>refrigerante</li>
    </ul>
</body>
</html>
